{% extends "base.html" %}

{% block title %}Access Forbidden (403) - NSAT{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
  <div class="col-md-6">
    <div class="display-1 fw-bold text-danger mb-3"><i class="bi bi-shield-slash"></i> 403</div>
    <h3 class="fw-bold text-dark">Access Forbidden</h3>
    <p class="text-muted mb-4">
      Security restriction violation: Attempted access to an unauthorized path or out-of-scope report resource.
    </p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 fw-semibold">
      <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
