{% extends "base.html" %}

{% block title %}Page Not Found (404) - NSAT{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
  <div class="col-md-6">
    <div class="display-1 fw-bold text-primary mb-3">404</div>
    <h3 class="fw-bold text-dark">Resource Not Found</h3>
    <p class="text-muted mb-4">
      The requested assessment, finding, report, or page could not be located in the local database.
    </p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 fw-semibold">
      <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
