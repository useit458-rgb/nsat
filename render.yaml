services:
  - type: web
    name: nsat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOW_PUBLIC_TARGETS
        value: "false"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
