[project]
name = "nsat"
version = "1.0.0"
description = "Network Security Assessment Toolkit - Defensive Security Audit System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "NSAT Team" }
]
dependencies = [
    "flask>=3.0.0",
    "werkzeug>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    "sqlalchemy>=2.0.0",
    "flask-wtf>=1.2.0",
    "wtforms>=3.1.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
